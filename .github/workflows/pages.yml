name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static site files
        run: |
          test -s index.html
          test -s styles.css
          test -s CNAME
          test -s robots.txt
          test -s sitemap.xml
          test -s images/engman-icon.png
          test -s images/og-image.png
          test -s images/app-store-badge.svg
          test -s images/shot-01-oneonones.jpg
          test -s images/shot-02-browse.jpg
          test -s images/shot-03-frameworks.jpg
          test -s images/shot-04-favourites.jpg
          test -s images/shot-05-create.jpg
          test -s images/shot-06-settings.jpg

      - name: Assemble Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/images
          cp index.html styles.css CNAME robots.txt sitemap.xml _site/
          cp images/engman-icon.png images/og-image.png images/app-store-badge.svg images/shot-01-oneonones.jpg images/shot-02-browse.jpg images/shot-03-frameworks.jpg images/shot-04-favourites.jpg images/shot-05-create.jpg images/shot-06-settings.jpg _site/images/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
